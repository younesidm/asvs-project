<nav class="navbar">
  <div class="navbar-inner">

    <div class="navbar-brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">OWASP ASVS</span>
        <span class="brand-subtitle">Compliance Tracker</span>
      </div>
    </div>

    <div class="navbar-links">
      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <a routerLink="/requirements"
         routerLinkActive="active"
         class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        Requirements
      </a>
    </div>

    <div class="navbar-score" *ngIf="complianceService.totalCount() > 0">
      <div class="score-ring">
        <svg viewBox="0 0 36 36" class="ring-svg">
          <path class="ring-bg"
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          <path class="ring-fill"
            [attr.stroke-dasharray]="complianceService.scorePercentage() + ', 100'"
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
        </svg>
        <span class="ring-text">{{ complianceService.scorePercentage() }}%</span>
      </div>
      <div class="score-info">
        <span class="score-label">Score</span>
        <span class="score-detail">{{ complianceService.passedCount() }}/{{ complianceService.totalCount() }} passed</span>
      </div>
    </div>

  </div>
</nav>
